plugins {
	id "fabric-loom" version "1.6.12"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		java.setSrcDirs(["src/legacyFabric/java"])
		resources.setSrcDirs(["src/legacyFabric/resources"])
	}
	test {
		java.setSrcDirs(["src/legacyFabricTest/java"])
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
	options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

tasks.register("verifyLegacySources") {
	doLast {
		def forbidden = ["net.minecraft.util.Identifier", "AvatarRenderState", "renderer.entity.state", "ClientAsset", "GoldenSpearRush", "lunge.json"]
		def roots = [file("src/legacyFabric")]
		forbidden.each { token ->
			def hit = roots.any { root -> fileTree(root).matching { include "**/*" }.files.any { file -> file.isFile() && file.text.contains(token) } }
			if (hit) throw new GradleException("1.20.1 Fabric source contains forbidden newer symbol/resource: ${token}")
		}
	}
}

tasks.named("check") { dependsOn("verifyLegacySources") }
