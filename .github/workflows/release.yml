name: Build and publish multiplatform release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc26.2-fabric
            ref: main
            java: "25"
            artifact_prefix: windowsdepcs-ai-companion-mc26.2-fabric
          - target: mc1.20.1-fabric
            ref: mc-1.20.1-fabric
            java: "17"
            artifact_prefix: windowsdepcs-ai-companion-mc1.20.1-fabric
          - target: mc1.20.1-forge
            ref: mc-1.20.1-forge
            java: "17"
            artifact_prefix: windowsdepcs-ai-companion-mc1.20.1-forge
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ matrix.target }} source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Stage installable mod
        shell: bash
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          ARTIFACT="${{ matrix.artifact_prefix }}-${VERSION}.jar"
          test -f "build/libs/${ARTIFACT}"
          mkdir -p release-assets
          cp "build/libs/${ARTIFACT}" release-assets/

      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release-assets/*.jar
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Validate release notes
        shell: bash
        run: test -s ".github/release-notes/${GITHUB_REF_NAME}.md"

      - name: Download all installable mods
        uses: actions/download-artifact@v4
        with:
          pattern: mc*
          path: release-assets
          merge-multiple: true

      - name: Validate release set
        shell: bash
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.jar' | wc -l)" -eq 3
          for jar in release-assets/*.jar; do unzip -t "$jar"; done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: release-assets/*.jar
