name: Build and publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Prepare installable release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp "build/libs/windowsdepcs-ai-companion-${release_version}.jar" release-assets/

      - name: Validate release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -s "$notes_file"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: release-assets/*.jar
